<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Inventory Audit System</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 12px; background-color: #f0f2f5; }
    .card { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 12px; }
    h3 { margin-top: 0; color: #1a73e8; text-align: center; }
    label { font-weight: bold; margin-top: 10px; display: block; font-size: 14px; color: #333; }
    select, input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #1557b0; }
    .info-box { background: #e8f0fe; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; border-left: 4px solid #1a73e8; }
    .prev-stock-box { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; border: 1px solid #ffeeba; }
    .page { display: none; }
    .active-page { display: block; }
    
    #syncStatus { text-align: center; font-weight: bold; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
    .status-loading { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }

    /* Search Bar with Integrated Scan Icon */
    .search-container { position: relative; width: 100%; margin-top: 5px; }
    .search-container input { width: 100%; padding-right: 48px; }
    .scan-icon-btn { 
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%); 
      background: #1a73e8; color: white; border: none; padding: 8px 12px; 
      border-radius: 6px; cursor: pointer; font-size: 16px; width: auto; margin: 0;
    }

    /* Inline Camera Container */
    #scannerWrapper { display: none; margin-top: 15px; text-align: center; background: #000; padding: 10px; border-radius: 8px; position: relative; }
    .cam-controls { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .cam-controls button { width: 48%; padding: 8px; font-size: 13px; }

    /* Camera Viewport and Scan Box Container */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 6px;
    }

    #reader { width: 100%; min-height: 250px; background: #000; }

    /* Visual Scanner Box Overlay */
    .scan-box-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 120px;
      border: 2px solid #2ecc71;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    /* Red Moving Laser Line */
    .laser-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ff0000;
      box-shadow: 0 0 8px #ff0000, 0 0 3px #ff0000;
      animation: laserMove 1.8s infinite ease-in-out;
    }

    @keyframes laserMove {
      0% { top: 5%; }
      50% { top: 90%; }
      100% { top: 5%; }
    }
  </style>
</head>
<body>

  <!-- PAGE 1: USER & LOCATION SETUP -->
  <div id="page1" class="page active-page">
    <div class="card">
      <h3>🚀 Audit Setup (Page 1/2)</h3>
      
      <label>Store Code:</label>
      <input type="text" id="storeCode" placeholder="E.g., STR101">

      <label>Employee Name:</label>
      <input type="text" id="empName" placeholder="Enter your full name">

      <label>SLoc (Storage Location):</label>
      <select id="slocSelect">
        <option value="">-- Select SLoc --</option>
        <option value="1000 - Salable">1000 - Salable</option>
        <option value="1001 - Display">1001 - Display</option>
        <option value="1003 - BOH">1003 - BOH</option>
        <option value="2994 - RTV">2994 - RTV</option>
        <option value="2995 - Insurance Claim">2995 - Insurance Claim</option>
      </select>

      <label>LHP / Bay Area:</label>
      <input type="text" id="lhpBay" placeholder="E.g., Bay-A12 or Rack-05">

      <button onclick="goToScanPage()" style="margin-top:20px;">Start Audit ➡️</button>
    </div>
  </div>

  <!-- PAGE 2: AUDIT ENTRY -->
  <div id="page2" class="page">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="headerInfo" style="font-size:12px; color:#555; font-weight:bold;"></span>
        <button onclick="goToSetupPage()" style="width:auto; padding:5px 10px; font-size:12px; background:#6c757d;">⚙️ Change Setup</button>
      </div>
      
      <h3>📷 Inventory Audit (Page 2/2)</h3>
      
      <!-- DATA SYNC STATUS INDICATOR -->
      <div id="syncStatus" class="status-loading">⏳ Connecting to Master Data...</div>

      <!-- Search Box with Integrated Camera Icon -->
      <label>Search Article ID / EAN / Name:</label>
      <div class="search-container">
        <input type="text" id="manualInput" list="articleList" placeholder="Type or click 📷 to scan..." oninput="onLiveInput(this.value)">
        <button class="scan-icon-btn" onclick="toggleScanner()" title="Scan Barcode">📷</button>
      </div>
      <datalist id="articleList">
        <!-- Live suggestions load here -->
      </datalist>

      <!-- Inline Camera Scanner Area -->
      <div id="scannerWrapper">
        <div class="cam-controls">
          <button id="torchBtn" onclick="toggleTorch()" style="background: #f39c12; display: none;">🔦 Flash On</button>
          <button onclick="stopScanner()" style="background: #e74c3c;">❌ Close Camera</button>
        </div>
        
        <div class="video-container">
          <div id="reader"></div>
          <!-- Custom Visual Overlay with Laser -->
          <div class="scan-box-overlay">
            <div class="laser-line"></div>
          </div>
        </div>
      </div>

      <!-- Result Card -->
      <div id="resultCard" class="info-box" style="display:none;">
        <p><strong>Article ID:</strong> <span id="resArticle">-</span></p>
        <p><strong>Description:</strong> <span id="resDesc">-</span></p>
        <p><strong>EAN / Code:</strong> <span id="resEAN">-</span></p>
        <p><strong>Brand / Category:</strong> <span id="resMeta">-</span></p>

        <!-- Previous Scan Stock Reference -->
        <div class="prev-stock-box">
          📊 Total Quantity Scanned So Far (All Bays): 
          <span id="resPrevTotal">0</span>
        </div>

        <label style="margin-top:15px;">Physical Scanned Quantity (For current location):</label>
        <input type="number" id="physicalQty" value="1" min="1">

        <button onclick="saveData()" style="background-color: #27ae60; margin-top:15px;">💾 Save Audit Entry</button>
      </div>

      <p id="msg" style="text-align:center; font-weight:bold; color:green; margin-top:10px;"></p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby51wXsL_DOrbXTpMD0GWrRW-XpAbETSud8llZSUOZ94AsXk-6hmlqAvv4inzYdLI-B/exec";
    
    let eanMap = {};
    let stockMap = {};
    let previousScans = {};
    let html5QrcodeScanner = null;
    let currentItem = {};
    let isTorchOn = false;
    let isCameraActive = false;

    window.onload = function() {
      loadMasterData();
    };

    function loadMasterData() {
      let statusDiv = document.getElementById('syncStatus');
      statusDiv.className = "status-loading";
      statusDiv.innerText = "⏳ Connecting to Google Sheets Master Data...";

      fetch(SCRIPT_URL, { redirect: "follow" })
        .then(res => res.json())
        .then(data => {
          eanMap = data.eanMap || {};
          stockMap = data.stockMap || {};
          previousScans = data.previousScans || {};

          let datalist = document.getElementById('articleList');
          datalist.innerHTML = "";
          
          let itemCount = 0;
          for (let key in eanMap) {
            let item = eanMap[key];
            let option = document.createElement('option');
            option.value = item.article + " - " + item.description + " (" + key + ")";
            datalist.appendChild(option);
            itemCount++;
          }

          statusDiv.className = "status-success";
          statusDiv.innerText = "✅ System Ready! (" + itemCount + " Articles Loaded)";
        })
        .catch(err => {
          console.error(err);
          statusDiv.className = "status-error";
          statusDiv.innerText = "❌ Master Data Sync Failed! Please check deployment settings.";
        });
    }

    function goToScanPage() {
      let storeCode = document.getElementById('storeCode').value.trim();
      let empName = document.getElementById('empName').value.trim();
      let sloc = document.getElementById('slocSelect').value;
      let lhpBay = document.getElementById('lhpBay').value.trim();

      if (!storeCode || !empName || !sloc || !lhpBay) {
        alert("Please fill in all details before proceeding!");
        return;
      }

      document.getElementById('headerInfo').innerText = storeCode + " | " + empName + " | " + lhpBay;
      document.getElementById('page1').classList.remove('active-page');
      document.getElementById('page2').classList.add('active-page');
    }

    function goToSetupPage() {
      document.getElementById('page2').classList.remove('active-page');
      document.getElementById('page1').classList.add('active-page');
      stopScanner();
    }

    function toggleScanner() {
      if (isCameraActive) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function startScanner() {
      document.getElementById('scannerWrapper').style.display = 'block';
      isCameraActive = true;

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      const config = { 
        fps: 25, 
        qrbox: { width: 280, height: 120 },
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        formatsToSupport: [ 
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E
        ]
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          stopScanner();
          processCodeLookup(decodedText);
        },
        (errorMessage) => {}
      ).then(() => {
        try {
          const track = html5QrcodeScanner.getRunningTrackCapabilities();
          if (track && track.torch) {
            document.getElementById('torchBtn').style.display = 'inline-block';
          }
        } catch(e) {}
      }).catch(err => {
        console.error("Camera error:", err);
        alert("Unable to access camera. Please allow Camera permissions in Chrome settings.");
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner && isCameraActive) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          isCameraActive = false;
          document.getElementById('scannerWrapper').style.display = 'none';
        }).catch(err => {
          console.log(err);
          isCameraActive = false;
          document.getElementById('scannerWrapper').style.display = 'none';
        });
      } else {
        document.getElementById('scannerWrapper').style.display = 'none';
      }
      isTorchOn = false;
      document.getElementById('torchBtn').innerText = "🔦 Flash On";
      document.getElementById('torchBtn').style.display = 'none';
    }

    function toggleTorch() {
      if (!html5QrcodeScanner) return;
      isTorchOn = !isTorchOn;
      html5QrcodeScanner.applyVideoConstraints({
        advanced: [{ torch: isTorchOn }]
      }).then(() => {
        document.getElementById('torchBtn').innerText = isTorchOn ? "🔦 Flash Off" : "🔦 Flash On";
      }).catch(err => console.log("Flash error:", err));
    }

    function onLiveInput(inputValue) {
      if (!inputValue) return;

      if (inputValue.includes("(") && inputValue.includes(")")) {
        let parts = inputValue.split("(");
        let searchCode = parts[parts.length - 1].replace(")", "").trim();
        processCodeLookup(searchCode);
      }
    }

    // Leading Zero (0) Ignored Code Search Function
    function processCodeLookup(searchCode) {
      let storeCode = document.getElementById('storeCode').value.trim();
      let sloc = document.getElementById('slocSelect').value;
      let cleanCode = String(searchCode).trim();
      
      let codeWithoutLeadingZeros = cleanCode.replace(/^0+/, '');

      let foundKey = Object.keys(eanMap).find(key => {
        let cleanKey = String(key).trim();
        let keyWithoutLeadingZeros = cleanKey.replace(/^0+/, '');
        
        let articleVal = String(eanMap[key].article || '').trim();
        let articleWithoutLeadingZeros = articleVal.replace(/^0+/, '');

        return cleanKey === cleanCode || 
               keyWithoutLeadingZeros === codeWithoutLeadingZeros ||
               articleVal === cleanCode ||
               articleWithoutLeadingZeros === codeWithoutLeadingZeros;
      });

      if (foundKey) {
        let item = eanMap[foundKey];
        document.getElementById('resEAN').innerText = foundKey;
        document.getElementById('resArticle').innerText = item.article;
        document.getElementById('resDesc').innerText = item.description;
        document.getElementById('resMeta').innerText = (item.brand || "N/A") + " (" + (item.brick || "N/A") + ")";

        let prevKey = storeCode + "_" + item.article;
        let prevQty = previousScans[prevKey] || 0;
        document.getElementById('resPrevTotal').innerText = prevQty;

        let sysStockKey = storeCode + "_" + item.article + "_" + sloc;
        let sysStock = stockMap[sysStockKey] || 0;

        currentItem = {
          scannedEAN: foundKey,
          article: item.article,
          description: item.description,
          segment: item.segment,
          family: item.family,
          classVal: item.classVal,
          mcCode: item.mcCode,
          brick: item.brick,
          brand: item.brand,
          systemStock: sysStock
        };

        document.getElementById('manualInput').value = foundKey;
        document.getElementById('resultCard').style.display = 'block';
      } else {
        alert("Article/Barcode not found in Master Data: " + cleanCode);
      }
    }

    function saveData() {
      let currentInputQty = Number(document.getElementById('physicalQty').value) || 0;
      let storeCode = document.getElementById('storeCode').value.trim();

      let payload = {
        storeCode: storeCode,
        empName: document.getElementById('empName').value.trim(),
        sloc: document.getElementById('slocSelect').value,
        lhpBay: document.getElementById('lhpBay').value.trim(),
        scannedEAN: currentItem.scannedEAN,
        article: currentItem.article,
        description: currentItem.description,
        segment: currentItem.segment,
        family: currentItem.family,
        classVal: currentItem.classVal,
        mcCode: currentItem.mcCode,
        brick: currentItem.brick,
        brand: currentItem.brand,
        systemStock: currentItem.systemStock,
        physicalQty: currentInputQty
      };

      document.getElementById('msg').innerText = "Saving entry...";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById('msg').innerText = "✅ Audit Entry Successfully Saved!";
        
        let prevKey = storeCode + "_" + currentItem.article;
        previousScans[prevKey] = (previousScans[prevKey] || 0) + currentInputQty;

        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('manualInput').value = "";
        document.getElementById('physicalQty').value = "1";
        
        setTimeout(() => { document.getElementById('msg').innerText = ""; }, 3000);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('msg').innerText = "❌ Error saving entry!";
      });
    }
  </script>
</body>
</html>
